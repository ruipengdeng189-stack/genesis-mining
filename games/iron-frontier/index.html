<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>铁轨远征</title>
    <meta name="description" content="铁轨远征：在单屏整备、路线事件与列车战斗之间推进成长。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/hub.css">
    <link rel="stylesheet" href="./iron-frontier.css">
</head>
<body>
    <div class="if-bg"></div>
    <div class="if-shell">
        <header class="if-topbar">
            <div class="if-topline">
                <a class="back-link" href="/" id="backToHubLink">← 返回大厅</a>
                <div class="topbar-actions">
                    <button class="ghost-btn" id="soundToggle" type="button" aria-pressed="false">音效关闭</button>
                    <div class="lang-toggle" role="group" aria-label="Language">
                        <button class="lang-btn is-active" type="button" data-lang-switch="zh" aria-pressed="true">ZH</button>
                        <button class="lang-btn" type="button" data-lang-switch="en" aria-pressed="false">EN</button>
                    </div>
                </div>
            </div>

            <section class="if-hero-card">
                <div class="if-hero-copy">
                    <div class="eyebrow" id="heroEyebrow">GENESIS · IRON FRONTIER</div>
                    <h1 id="heroTitle">铁轨远征</h1>
                    <p id="heroSubtitle">列车生存经营 · 路线事件 · 局外成长</p>
                    <div class="if-hero-chips" id="heroChips"></div>
                </div>
                <div class="if-resource-strip" id="resourceStrip"></div>
            </section>
        </header>

        <main class="if-main">
            <section class="if-summary-card" id="heroSummary"></section>
            <section class="if-panel-card">
                <div class="if-panel-content" id="panelContent"></div>
            </section>
        </main>

        <nav class="if-tabbar" id="tabBar" aria-label="Iron Frontier Tabs"></nav>

        <div class="if-battle-overlay is-hidden" id="battleOverlay">
            <div class="if-battle-shell">
                <div class="if-battle-top">
                    <div>
                        <div class="eyebrow" id="battleEyebrow">列车战斗</div>
                        <h2 id="battleStageTitle">当前战区</h2>
                    </div>
                    <button class="ghost-btn icon-btn" id="battleCloseBtn" type="button" aria-label="关闭战斗">&times;</button>
                </div>

                <div class="if-battle-hud">
                    <div class="if-hud-card">
                        <span id="battleIntegrityLabel">车体</span>
                        <strong id="battleIntegrityValue">100%</strong>
                        <div class="if-meter"><span id="battleIntegrityBar"></span></div>
                    </div>
                    <div class="if-hud-card">
                        <span id="battleShieldLabel">护盾</span>
                        <strong id="battleShieldValue">100%</strong>
                        <div class="if-meter shield"><span id="battleShieldBar"></span></div>
                    </div>
                    <div class="if-hud-card">
                        <span id="battleHeatLabel">热量</span>
                        <strong id="battleHeatValue">0%</strong>
                        <div class="if-meter heat"><span id="battleHeatBar"></span></div>
                    </div>
                    <div class="if-hud-card">
                        <span id="battleProgressLabel">进度</span>
                        <strong id="battleProgressValue">0%</strong>
                        <div class="if-meter progress"><span id="battleProgressBar"></span></div>
                    </div>
                </div>

                <div class="if-battle-field" id="battleField">
                    <div class="if-battle-fx" id="battleFx" aria-hidden="true"></div>
                    <div class="if-battle-route" id="battleWaveStrip" aria-hidden="true"></div>
                    <div class="if-battle-objective" id="battleObjective"></div>
                    <div class="if-battle-rail"></div>
                    <div class="if-train" id="battleTrain">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="if-threat-lane" id="battleThreatLane"></div>
                    <div class="if-battle-tip" id="battleTip"></div>
                    <div class="if-battle-status-badge" id="battleStatusBadge"></div>
                </div>

                <div class="if-battle-bottom">
                    <div class="if-battle-events" id="battleEventArea"></div>
                    <div class="if-battle-actions">
                        <button class="if-skill-btn" type="button" data-battle-action="overdrive">超载</button>
                        <button class="if-skill-btn" type="button" data-battle-action="barrier">护盾</button>
                        <button class="if-skill-btn" type="button" data-battle-action="repair">修复</button>
                        <button class="if-skill-btn is-ultimate" type="button" data-battle-action="ultimate">轨炮</button>
                        <button class="primary-btn if-advance-btn" id="battleAdvanceBtn" type="button" data-battle-action="advance">推进下一段</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="if-drawer is-hidden" id="offerDrawer">
            <div class="if-drawer-card">
                <div class="if-drawer-head">
                    <div>
                        <div class="eyebrow" id="drawerEyebrow">精选礼包</div>
                        <h2 id="drawerTitle">新手列车包</h2>
                    </div>
                    <button class="ghost-btn icon-btn" id="offerCloseBtn" type="button" aria-label="关闭礼包">&times;</button>
                </div>
                <div class="if-drawer-body" id="offerDrawerBody"></div>
                <div class="if-drawer-actions">
                    <button class="ghost-btn wide-btn" id="offerLaterBtn" type="button">关闭</button>
                    <button class="primary-btn wide-btn" id="offerMockPayBtn" type="button">创建订单</button>
                </div>
            </div>
        </div>

        <div class="if-toast" id="toast"></div>
    </div>

    <script src="../../shared/procedural-sfx.js"></script>
    <script src="./iron-frontier.config.js"></script>
    <script src="./iron-frontier.js"></script>
</body>
</html>
